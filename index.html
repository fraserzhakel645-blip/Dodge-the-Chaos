<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodge the Chaos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 30px;
    }

    p {
      margin: 5px;
    }

    #gameContainer {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #222;
      border: 3px solid white;
      border-radius: 8px;
      margin: 10px auto;
      touch-action: none;
    }

    button {
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      padding: 12px 25px;
      cursor: pointer;
    }

    #start {
      margin: 5px;
    }

    /* MOBILE CONTROLS */

    #controls {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 10px;
      user-select: none;
    }

    .control {
      width: 110px;
      height: 65px;
      font-size: 32px;
      background: #333;
      color: white;
      border: 2px solid white;
      touch-action: none;
    }

    .control:active {
      background: #666;
      transform: scale(0.95);
    }

    @media (min-width: 700px) {
      #controls {
        display: none;
      }
    }

    #stats {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .stat {
      background: #1b1b1b;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 7px 12px;
      min-width: 120px;
      font-weight: bold;
    }

    #message {
      min-height: 34px;
      font-size: 25px;
      font-weight: 900;
      margin: 5px 0;
    }

    #leaderboard {
      margin: 12px auto;
      background: #1b1b1b;
      border: 2px solid #555;
      border-radius: 12px;
      padding: 10px;
      max-width: 420px;
      text-align: left;
    }

    #leaderboard h2 {
      text-align: center;
      margin: 3px 0 8px;
      font-size: 22px;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 8px;
      border-bottom: 1px solid #333;
    }

    .leader-row:last-child {
      border-bottom: none;
    }

    .you {
      font-weight: 900;
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <div id="gameContainer">

    <h1>💀 Dodge the Chaos</h1>

    <div id="stats">
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">🏆 Personal Best: <span id="personalBest">0</span></div>
      <div class="stat">🌎 World Best: <span id="worldBest">0</span></div>
    </div>

    <div id="message"></div>

    <div id="leaderboard">
      <h2>🏆 WORLD LEADERBOARD</h2>
      <div id="leaderRows"></div>
    </div>

    <canvas id="canvas" width="600" height="350"></canvas>

    <button id="start">START GAME</button>

    <div id="controls">

      <button class="control" id="left">
        ⬅️
      </button>

      <button class="control" id="right">
        ➡️
      </button>

    </div>

  </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

// ===== ONLINE WORLD LEADERBOARD =====
// After creating your Supabase project, paste your Project URL and
// Publishable key below. Never put a secret/service_role key here.
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
const onlineLeaderboardEnabled =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_YOUR") &&
  !SUPABASE_KEY.includes("PASTE_YOUR");

const supabaseClient = onlineLeaderboardEnabled
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const startButton = document.getElementById("start");
const personalBestText = document.getElementById("personalBest");
const worldBestText = document.getElementById("worldBest");
const leaderRows = document.getElementById("leaderRows");
const message = document.getElementById("message");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");


let player;
let blocks;
let score;
let playing;
let lastTime;
let spawnTimer;

updateLeaderboard();


const keys = {};


// ========================
// KEYBOARD CONTROLS
// ========================

document.addEventListener("keydown", function(e) {

  keys[e.key.toLowerCase()] = true;

});


document.addEventListener("keyup", function(e) {

  keys[e.key.toLowerCase()] = false;

});


// ========================
// TOUCH CONTROLS
// ========================

let touchingLeft = false;
let touchingRight = false;


// LEFT BUTTON

leftButton.addEventListener("pointerdown", function(e) {

  e.preventDefault();

  touchingLeft = true;

});

leftButton.addEventListener("pointerup", function(e) {

  e.preventDefault();

  touchingLeft = false;

});

leftButton.addEventListener("pointercancel", function() {

  touchingLeft = false;

});

leftButton.addEventListener("pointerleave", function() {

  touchingLeft = false;

});


// RIGHT BUTTON

rightButton.addEventListener("pointerdown", function(e) {

  e.preventDefault();

  touchingRight = true;

});

rightButton.addEventListener("pointerup", function(e) {

  e.preventDefault();

  touchingRight = false;

});

rightButton.addEventListener("pointercancel", function() {

  touchingRight = false;

});

rightButton.addEventListener("pointerleave", function() {

  touchingRight = false;

});


// ========================
// SCORE / LEADERBOARD
// ========================

let personalBest = Number(localStorage.getItem("dtcPersonalBest") || 0);

// Local fallback is used until the Supabase settings are filled in.
// Once connected, every player uses the same online leaderboard.
let leaderboard = JSON.parse(localStorage.getItem("dtcLeaderboard") || "null");

if (!Array.isArray(leaderboard) || leaderboard.length === 0) {
  leaderboard = [
    { name: "ChaosMaster", score: 42 },
    { name: "DodgeKing", score: 35 },
    { name: "BlockDodger", score: 28 },
    { name: "Speedy", score: 21 },
    { name: "Rookie", score: 14 }
  ];
}

function getWorldBest() {
  return Math.max(0, ...leaderboard.map(entry => Number(entry.score) || 0));
}

function renderLeaderboard(rows) {
  leaderboard = rows;
  leaderboard.sort((a, b) => b.score - a.score);
  leaderboard = leaderboard.slice(0, 10);

  localStorage.setItem("dtcLeaderboard", JSON.stringify(leaderboard));
  worldBestText.textContent = getWorldBest();
  personalBestText.textContent = personalBest;

  leaderRows.innerHTML = leaderboard.map((entry, index) => `
    <div class="leader-row">
      <span>${index + 1}. ${String(entry.name).replace(/[<>&"]/g, "")}</span>
      <span>${entry.score}</span>
    </div>
  `).join("");
}

async function loadOnlineLeaderboard() {
  if (!onlineLeaderboardEnabled) {
    renderLeaderboard(leaderboard);
    return;
  }

  const { data, error } = await supabaseClient
    .from("scores")
    .select("name, score")
    .order("score", { ascending: false })
    .limit(10);

  if (error) {
    console.error("Leaderboard load error:", error);
    renderLeaderboard(leaderboard);
    return;
  }

  renderLeaderboard(data || []);
}

async function saveScore(finalScore) {
  const final = Math.floor(finalScore);

  if (final > personalBest) {
    personalBest = final;
    localStorage.setItem("dtcPersonalBest", personalBest);
    message.textContent = "🔥 NEW PERSONAL BEST!";
  }

  if (onlineLeaderboardEnabled) {
    const playerName = (prompt("You made the leaderboard! Enter your name:") || "Anonymous")
      .trim()
      .slice(0, 16) || "Anonymous";

    const { error } = await supabaseClient
      .from("scores")
      .insert({ name: playerName, score: final });

    if (error) {
      console.error("Score upload error:", error);
      message.textContent = "💀 WOMP WOMP 💀";
    } else {
      await loadOnlineLeaderboard();
      if (final >= getWorldBest()) {
        message.textContent = "🌎 NEW WORLD BEST!!! 🔥";
      }
    }
  } else {
    const currentWorldBest = getWorldBest();

    if (final > currentWorldBest) {
      leaderboard.push({ name: "YOU", score: final });
      message.textContent = "🌎 NEW WORLD BEST!!! 🔥";
    } else if (final >= 1) {
      leaderboard.push({ name: "YOU", score: final });
    }

    renderLeaderboard(leaderboard);
  }
}

// ========================
// START GAME
// ========================

function startGame() {

  player = {

    x: 275,

    y: 315,

    width: 50,

    height: 20,

    speed: 300

  };


  blocks = [];


  score = 0;


  playing = true;


  spawnTimer = 0;


  lastTime = performance.now();


  scoreText.textContent = "0";


  startButton.textContent = "RESTART";
  message.textContent = "";


  requestAnimationFrame(gameLoop);

}


// ========================
// CREATE ENEMY
// ========================

function spawnBlock() {

  const size = 20 + Math.random() * 25;


  blocks.push({

    x: Math.random() * (canvas.width - size),

    y: -size,

    width: size,

    height: size,

    speed: 150 + Math.random() * 150

  });

}


// ========================
// COLLISION
// ========================

function collision(a, b) {

  return (

    a.x < b.x + b.width &&

    a.x + a.width > b.x &&

    a.y < b.y + b.height &&

    a.y + a.height > b.y

  );

}


// ========================
// GAME LOOP
// ========================

function gameLoop(time) {

  if (!playing) return;


  const delta = (time - lastTime) / 1000;


  lastTime = time;


  // PLAYER MOVEMENT

  if (

    keys["arrowleft"] ||

    keys["a"] ||

    touchingLeft

  ) {

    player.x -= player.speed * delta;

  }


  if (

    keys["arrowright"] ||

    keys["d"] ||

    touchingRight

  ) {

    player.x += player.speed * delta;

  }


  // KEEP PLAYER INSIDE SCREEN

  player.x = Math.max(

    0,

    Math.min(

      canvas.width - player.width,

      player.x

    )

  );


  // SCORE

  score += delta;


  scoreText.textContent =

    Math.floor(score);


  // SPAWN ENEMIES

  spawnTimer -= delta;


  if (spawnTimer <= 0) {

    spawnBlock();


    spawnTimer = Math.max(

      0.2,

      0.7 - score / 100

    );

  }


  // MOVE ENEMIES

  for (const block of blocks) {

    block.y += block.speed * delta;


    // COLLISION

    if (collision(player, block)) {

      playing = false;


      alert(

        "💀 GAME OVER!\n\nScore: " +

        Math.floor(score)

      );


      return;

    }

  }


  // REMOVE OLD ENEMIES

  blocks = blocks.filter(

    block =>

      block.y < canvas.height + 50

  );


  // ========================
  // DRAW
  // ========================

  ctx.clearRect(

    0,

    0,

    canvas.width,

    canvas.height

  );


  // BACKGROUND

  ctx.fillStyle = "#222";


  ctx.fillRect(

    0,

    0,

    canvas.width,

    canvas.height

  );


  // PLAYER

  ctx.fillStyle = "#4ade80";


  ctx.fillRect(

    player.x,

    player.y,

    player.width,

    player.height

  );


  // ENEMIES

  for (const block of blocks) {

    ctx.fillStyle = block.color;

    ctx.fillRect(

      block.x,

      block.y,

      block.width,

      block.height

    );

  }


  requestAnimationFrame(gameLoop);

}


function drawGameOver() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#222";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw remaining blocks
  for (const block of blocks) {
    ctx.fillStyle = block.color;
    ctx.fillRect(block.x, block.y, block.width, block.height);
  }

  // Draw player
  ctx.fillStyle = "#4ade80";
  ctx.fillRect(player.x, player.y, player.width, player.height);

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = "900 52px Arial";
  ctx.fillText("WOMP WOMP 💀", canvas.width / 2, 135);

  ctx.font = "bold 24px Arial";
  ctx.fillText("Score: " + Math.floor(score), canvas.width / 2, 180);
  ctx.fillText("Personal Best: " + personalBest, canvas.width / 2, 215);

  ctx.font = "bold 18px Arial";
  ctx.fillText("Press PLAY AGAIN to try again!", canvas.width / 2, 255);
  ctx.textAlign = "left";
}

// START BUTTON

startButton.addEventListener(

  "click",

  startGame

);

</script>

</body>
</html>
