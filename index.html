<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodge the Chaos</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      margin: 15px 0 6px;
      font-size: 30px;
    }

    #gameContainer {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 0 8px 20px;
    }

    #stats {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .stat {
      background: #1b1b1b;
      border: 1px solid #555;
      border-radius: 10px;
      padding: 7px 10px;
      font-weight: bold;
      min-width: 120px;
    }

    #message {
      min-height: 34px;
      font-size: 24px;
      font-weight: 900;
      margin: 4px 0;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      background: #222;
      border: 3px solid #fff;
      border-radius: 8px;
      margin: 10px auto;
      touch-action: none;
    }

    button {
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      padding: 12px 25px;
      cursor: pointer;
    }

    #start {
      margin: 5px;
    }

    #controls {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 10px;
      user-select: none;
    }

    .control {
      width: 110px;
      height: 65px;
      font-size: 32px;
      background: #333;
      color: #fff;
      border: 2px solid #fff;
      touch-action: none;
    }

    .control:active {
      background: #666;
      transform: scale(.95);
    }

    #leaderboard {
      margin: 10px auto;
      max-width: 430px;
      background: #1b1b1b;
      border: 2px solid #555;
      border-radius: 12px;
      padding: 10px;
      text-align: left;
    }

    #leaderboard h2 {
      text-align: center;
      margin: 3px 0 4px;
      font-size: 21px;
    }

    #leaderStatus {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .leader-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 8px;
      border-bottom: 1px solid #333;
    }

    .leader-row:last-child { border-bottom: 0; }

    @media (min-width: 700px) {
      #controls { display: none; }
    }
  </style>
</head>

<body>
  <div id="gameContainer">
    <h1>💀 Dodge the Chaos</h1>

    <div id="stats">
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">🏆 Personal Best: <span id="personalBest">0</span></div>
      <div class="stat">🌎 World Best: <span id="worldBest">—</span></div>
    </div>

    <div id="message"></div>

    <canvas id="canvas" width="600" height="350"></canvas>

    <button id="start">START GAME</button>

    <div id="controls">
      <button class="control" id="left" aria-label="Move left">⬅️</button>
      <button class="control" id="right" aria-label="Move right">➡️</button>
    </div>

    <div id="leaderboard">
      <h2>🏆 WORLD LEADERBOARD</h2>
      <div id="leaderStatus">Online leaderboard will appear when connected.</div>
      <div id="leaderRows">
        <div class="leader-row"><span>No online scores yet</span><span>—</span></div>
      </div>
    </div>
  </div>

  <!-- Supabase is optional. The game NEVER depends on it to start. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
          onerror="window.supabaseLoadFailed=true"></script>

  <script>
    "use strict";

    // ========================
    // OPTIONAL ONLINE LEADERBOARD
    // ========================
    // These stay placeholders until the Supabase project is created.
    // The game works normally without them.
    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
    const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

    const onlineLeaderboardEnabled =
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("PASTE_YOUR") &&
      !SUPABASE_KEY.includes("PASTE_YOUR") &&
      window.supabase &&
      typeof window.supabase.createClient === "function";

    let supabaseClient = null;

    if (onlineLeaderboardEnabled) {
      try {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );
      } catch (error) {
        console.error("Supabase setup error:", error);
        supabaseClient = null;
      }
    }

    // ========================
    // DOM
    // ========================
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const personalBestText = document.getElementById("personalBest");
    const worldBestText = document.getElementById("worldBest");
    const startButton = document.getElementById("start");
    const message = document.getElementById("message");
    const leaderRows = document.getElementById("leaderRows");
    const leaderStatus = document.getElementById("leaderStatus");

    const leftButton = document.getElementById("left");
    const rightButton = document.getElementById("right");

    // ========================
    // GAME STATE
    // ========================
    let player = null;
    let blocks = [];
    let score = 0;
    let playing = false;
    let lastTime = 0;
    let spawnTimer = 0;

    const keys = {
      left: false,
      right: false
    };

    let touchingLeft = false;
    let touchingRight = false;

    const BLOCK_COLORS = [
      "#ff4057",
      "#a855f7",
      "#3b82f6",
      "#22c55e",
      "#f59e0b",
      "#ec4899",
      "#06b6d4"
    ];

    // ========================
    // PERSONAL BEST
    // ========================
    let personalBest = 0;

    try {
      personalBest = Number(localStorage.getItem("dtcPersonalBest")) || 0;
    } catch (error) {
      console.warn("Could not read personal best:", error);
    }

    personalBestText.textContent = personalBest;

    // ========================
    // KEYBOARD CONTROLS
    // ========================
    document.addEventListener("keydown", function (event) {
      const key = event.key.toLowerCase();

      if (key === "arrowleft" || key === "a") {
        keys.left = true;
        event.preventDefault();
      }

      if (key === "arrowright" || key === "d") {
        keys.right = true;
        event.preventDefault();
      }

      if ((key === " " || key === "enter") && !playing) {
        startGame();
      }
    });

    document.addEventListener("keyup", function (event) {
      const key = event.key.toLowerCase();

      if (key === "arrowleft" || key === "a") keys.left = false;
      if (key === "arrowright" || key === "d") keys.right = false;
    });

    // ========================
    // MOBILE CONTROLS
    // ========================
    function setLeft(value) {
      touchingLeft = value;
    }

    function setRight(value) {
      touchingRight = value;
    }

    function bindHoldButton(button, setter) {
      button.addEventListener("pointerdown", function (event) {
        event.preventDefault();
        setter(true);
        try { button.setPointerCapture(event.pointerId); } catch (_) {}
      });

      button.addEventListener("pointerup", function (event) {
        event.preventDefault();
        setter(false);
      });

      button.addEventListener("pointercancel", function () {
        setter(false);
      });

      button.addEventListener("lostpointercapture", function () {
        setter(false);
      });
    }

    bindHoldButton(leftButton, setLeft);
    bindHoldButton(rightButton, setRight);

    // ========================
    // START / RESTART
    // ========================
    function startGame() {
      player = {
        x: (canvas.width - 50) / 2,
        y: canvas.height - 35,
        width: 50,
        height: 20,
        speed: 300
      };

      blocks = [];
      score = 0;
      playing = true;
      spawnTimer = 0.35;
      lastTime = performance.now();

      scoreText.textContent = "0";
      message.textContent = "";
      startButton.textContent = "RESTART";

      // Draw immediately so there is never a blank frame.
      drawGame();

      requestAnimationFrame(gameLoop);
    }

    // ========================
    // CREATE BLOCK
    // ========================
    function spawnBlock() {
      const size = 20 + Math.random() * 25;

      blocks.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        width: size,
        height: size,
        speed: 150 + Math.random() * 150 + Math.min(score * 2, 180),
        color: BLOCK_COLORS[
          Math.floor(Math.random() * BLOCK_COLORS.length)
        ]
      });
    }

    // ========================
    // COLLISION
    // ========================
    function collision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    // ========================
    // GAME LOOP
    // ========================
    function gameLoop(time) {
      if (!playing) return;

      // Protect against huge time jumps after a tab switch.
      const delta = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      if (keys.left || touchingLeft) {
        player.x -= player.speed * delta;
      }

      if (keys.right || touchingRight) {
        player.x += player.speed * delta;
      }

      player.x = Math.max(
        0,
        Math.min(canvas.width - player.width, player.x)
      );

      score += delta;
      scoreText.textContent = Math.floor(score);

      spawnTimer -= delta;

      if (spawnTimer <= 0) {
        spawnBlock();

        // Gets harder, but never spawns faster than every 0.20 seconds.
        spawnTimer = Math.max(0.20, 0.70 - score / 100);
      }

      for (const block of blocks) {
        block.y += block.speed * delta;

        if (collision(player, block)) {
          endGame();
          return;
        }
      }

      blocks = blocks.filter(
        block => block.y < canvas.height + 60
      );

      drawGame();
      requestAnimationFrame(gameLoop);
    }

    // ========================
    // END GAME
    // ========================
    function endGame() {
      playing = false;

      const finalScore = Math.floor(score);
      const isNewPB = finalScore > personalBest;

      if (isNewPB) {
        personalBest = finalScore;

        try {
          localStorage.setItem(
            "dtcPersonalBest",
            String(personalBest)
          );
        } catch (error) {
          console.warn("Could not save personal best:", error);
        }

        personalBestText.textContent = personalBest;
      }

      message.textContent = isNewPB
        ? "🔥 NEW PERSONAL BEST!"
        : "💀 WOMP WOMP 💀";

      startButton.textContent = "PLAY AGAIN";

      drawGameOver();

      // This never blocks or stops the game if the online service
      // isn't connected.
      submitScore(finalScore);
    }

    // ========================
    // DRAW GAME
    // ========================
    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#222";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Simple background grid.
      ctx.strokeStyle = "#2d2d2d";
      ctx.lineWidth = 1;

      for (let x = 0; x <= canvas.width; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = 0; y <= canvas.height; y += 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      if (!player) return;

      // Player.
      ctx.fillStyle = "#4ade80";
      ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
      );

      // Player outline.
      ctx.strokeStyle = "#fff";
      ctx.strokeRect(
        player.x,
        player.y,
        player.width,
        player.height
      );

      // Chaos blocks.
      for (const block of blocks) {
        ctx.fillStyle = block.color;
        ctx.fillRect(
          block.x,
          block.y,
          block.width,
          block.height
        );

        ctx.strokeStyle = "#fff";
        ctx.strokeRect(
          block.x,
          block.y,
          block.width,
          block.height
        );
      }
    }

    // ========================
    // GAME OVER SCREEN
    // ========================
    function drawGameOver() {
      drawGame();

      ctx.fillStyle = "rgba(0, 0, 0, 0.62)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";

      ctx.font = "900 46px Arial";
      ctx.fillText(
        "WOMP WOMP 💀",
        canvas.width / 2,
        125
      );

      ctx.font = "bold 24px Arial";
      ctx.fillText(
        "Score: " + Math.floor(score),
        canvas.width / 2,
        170
      );

      ctx.fillText(
        "Personal Best: " + personalBest,
        canvas.width / 2,
        205
      );

      ctx.font = "bold 18px Arial";
      ctx.fillText(
        "Press PLAY AGAIN!",
        canvas.width / 2,
        250
      );

      ctx.textAlign = "left";
    }

    // ========================
    // ONLINE LEADERBOARD
    // ========================
    async function submitScore(finalScore) {
      if (!supabaseClient) return;

      try {
        let savedName = "";
        try {
          savedName = localStorage.getItem("dtcPlayerName") || "";
        } catch (_) {}

        const enteredName = prompt(
          "Enter your name for the world leaderboard:",
          savedName
        );

        const name = String(enteredName || "Anonymous")
          .replace(/[<>]/g, "")
          .trim()
          .slice(0, 16) || "Anonymous";

        try {
          localStorage.setItem("dtcPlayerName", name);
        } catch (_) {}

        const { error } = await supabaseClient
          .from("scores")
          .insert({
            name: name,
            score: finalScore
          });

        if (error) throw error;

        await loadLeaderboard();
      } catch (error) {
        console.error("Could not submit score:", error);
      }
    }

    async function loadLeaderboard() {
      if (!supabaseClient) {
        worldBestText.textContent = "—";
        leaderStatus.textContent =
          "Online leaderboard not connected yet.";
        return;
      }

      try {
        const { data, error } = await supabaseClient
          .from("scores")
          .select("name, score")
          .order("score", { ascending: false })
          .limit(10);

        if (error) throw error;

        renderLeaderboard(data || []);
      } catch (error) {
        console.error("Could not load leaderboard:", error);
        worldBestText.textContent = "—";
        leaderStatus.textContent = "Could not load online scores.";
      }
    }

    function renderLeaderboard(rows) {
      const sorted = [...rows].sort(
        (a, b) => Number(b.score) - Number(a.score)
      );

      if (sorted.length === 0) {
        worldBestText.textContent = "0";
        leaderRows.innerHTML =
          '<div class="leader-row"><span>No scores yet</span><span>—</span></div>';
        return;
      }

      worldBestText.textContent =
        Math.floor(Number(sorted[0].score) || 0);

      leaderStatus.textContent =
        "Top players from everyone who submits a score.";

      leaderRows.innerHTML = sorted
        .slice(0, 10)
        .map((entry, index) => {
          const safeName = String(entry.name || "Anonymous")
            .replace(/[<>&"]/g, "");

          return `
            <div class="leader-row">
              <span>${index + 1}. ${safeName}</span>
              <span>${Math.floor(Number(entry.score) || 0)}</span>
            </div>
          `;
        })
        .join("");
    }

    // ========================
    // INITIAL SCREEN
    // ========================
    drawGame();
    loadLeaderboard();

    startButton.addEventListener("click", startGame);
  </script>
</body>
</html>
